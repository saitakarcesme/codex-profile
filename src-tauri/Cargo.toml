[package]
name = "codex-profile-ui"
version = "0.1.0"
description = "A lightweight cross-platform Codex account selector"
authors = ["Codex Profile contributors"]
edition = "2021"

[lib]
name = "codex_profile_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
